<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navi Lyrics — moved to navilyrics.com</title>
    <!-- Navi Lyrics se mudó a navilyrics.com. GitHub Pages no permite 301:
         meta refresh 0 + canonical es lo que Google trata como redirección permanente. -->
    <link rel="canonical" href="https://navilyrics.com/" />
    <meta http-equiv="refresh" content="0; url=https://navilyrics.com/" />
    <script>location.replace('https://navilyrics.com/' + location.search + location.hash);</script>
    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a192f;color:#9ca3af;font:16px system-ui,sans-serif}a{color:#0df2f2}</style>
</head>
<body>
    <p>Navi Lyrics has moved to <a href="https://navilyrics.com/">https://navilyrics.com/</a></p>
</body>
</html>
