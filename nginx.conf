server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Traefik termina TLS: las redirecciones deben ser relativas para no
    # mandar al usuario a http://.
    absolute_redirect off;

    # URLs limpias: /privacy-policy.html -> /privacy-policy (301), así los
    # enlaces viejos (Chrome Web Store, popup de la extensión) siguen funcionando.
    location ~ ^/index\.html$ {
        return 301 /;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # try_files sirve el archivo directo; con `index` sería un redirect interno
    # a /index.html que caería en el 301 de arriba y haría loop.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
