server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Traefik termina TLS: las redirecciones deben ser relativas para no
    # mandar al usuario a http://.
    absolute_redirect off;

    # Skins del demo (copias de la extensión): se sirven tal cual, con .html.
    # `^~` evita que caigan en los 301 de abajo.
    location ^~ /skins/ {
        # Se cargan dentro del iframe del hero; no deben indexarse como páginas sueltas.
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    # URLs limpias, así los enlaces viejos (Chrome Web Store, popup de la
    # extensión) siguen funcionando:
    #   /index.html -> /    /es/index.html -> /es/    /privacy-policy.html -> /privacy-policy
    location ~ ^/(.*/)?index\.html$ {
        return 301 /$1;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # Directorios (/ y /es/): try_files sirve el index.html directo. Con la
    # directiva `index` sería un redirect interno a .../index.html que caería
    # en el 301 de arriba y haría loop.
    location ~ /$ {
        try_files ${uri}index.html =404;
    }

    # /es (sin barra) -> /es/ lo resuelve nginx solo al encontrar el directorio
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
