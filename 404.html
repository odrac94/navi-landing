<!DOCTYPE html>

<head>

    <title>Navi Lyrics — moved to navilyrics.com</title>
    <!-- Cualquier otra ruta vieja (/navi-landing/loquesea.html) va a su equivalente en navilyrics.com -->
    <script>
        (function () {
            var path = location.pathname.replace(/^\/navi-landing/, '').replace(/index\.html$/, '').replace(/\.html$/, '');
            location.replace('https://navilyrics.com' + (path || '/') + location.search + location.hash);
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=https://navilyrics.com/" />
